{% extends 'base.html' %}{% block content %}<h1>📦 Services</h1><input id="search" placeholder="Search services..." oninput="filterServices()">{% for s in services %}<div class="card service"><h2>{{s['name']}}</h2><small>{{s['category']}} • ID {{s['id']}}</small><p>{{s['description']}}</p><b>Rate: Rs. {{'%.2f'|format(s['rate'])}}</b><br><small>Min {{s['min_qty']}} • Max {{s['max_qty']}}</small></div>{% endfor %}<script>function filterServices(){let q=search.value.toLowerCase();document.querySelectorAll('.service').forEach(x=>x.style.display=x.innerText.toLowerCase().includes(q)?'block':'none')}</script>{% endblock %}
