{% extends 'base.html' %}{% block content %}<div class="page-title"><h1>Users</h1></div><div class="panel table-wrap"><table class="table"><tr><th>ID</th><th>Username</th><th>Email</th><th>Balance</th><th>Add Balance</th></tr>{% for u in users %}<tr><td>{{u.id}}</td><td>{{u.username}}</td><td>{{u.email}}</td><td>₨ {{'%.2f'|format(u.balance)}}</td><td><form method="post" action="/admin/add-balance/{{u.id}}"><input name="amount" type="number" step="0.01"><button class="btn">ADD</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
