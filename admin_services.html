{% extends 'base.html' %}{% block content %}<div class="page-title"><h1>Manage Services</h1></div><div class="panel"><form method="post"><div class="grid2"><div><label>Name</label><input name="name" required></div><div><label>Category</label><input name="category" required></div><div><label>Rate / 1K</label><input name="rate" type="number" step="0.01" required></div><div><label>Min</label><input name="min_qty" type="number" value="100"></div><div><label>Max</label><input name="max_qty" type="number" value="100000"></div><div><label>Description</label><input name="description"></div></div><button class="btn">ADD SERVICE</button></form></div><div class="panel table-wrap"><table class="table"><tr><th>ID</th><th>Name</th><th>Category</th><th>Rate</th></tr>{% for s in services %}<tr><td>{{s.id}}</td><td>{{s.name}}</td><td>{{s.category}}</td><td>₨ {{s.rate}}</td></tr>{% endfor %}</table></div>{% endblock %}
